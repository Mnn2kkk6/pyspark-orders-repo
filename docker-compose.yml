# docker-compose.yml
# ---------------------------------------------------------------------------
# Chạy MinIO (S3-compatible object storage) local để thực hành upload
# Bronze/Silver/Gold lên "cloud storage" giả lập ngay trên máy.
#
# Cách chạy:   docker compose up -d
# Console web: http://localhost:9001  (đăng nhập bằng MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
# API endpoint : http://localhost:9000
# ---------------------------------------------------------------------------
services:
  minio:
    image: minio/minio:latest
    container_name: minio-lakehouse
    ports:
      - "9000:9000"   # API endpoint - code/mc CLI kết nối vào đây
      - "9001:9001"   # Web console - mở trình duyệt vào đây để xem trực quan
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow-lakehouse
    restart: unless-stopped
    ports:
      - "8080:8080"   # Airflow web UI
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"   # tắt các DAG mẫu có sẵn cho đỡ rối đến UI
      # KHÔNG set AIRFLOW__CORE__EXECUTOR ở đây: chế độ "standalone" mặc định
      # dùng SQLite + SequentialExecutor. Ép LocalExecutor sẽ lỗi vì SQLite
      # không hỗ trợ LocalExecutor .
    volumes:
      - ./dags:/opt/airflow/dags             # map thư mục dags/ trong repo vào Airflow
      - airflow_data:/opt/airflow             # giữ lại DB/log giữa các lần restart container
    # "standalone" tự động: khởi tạo DB, tạo user admin, chạy webserver + scheduler
    command: standalone

volumes:
  minio_data:
  airflow_data:
